<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <meta name="description" content="RenAI — Beyond Intelligence. Beyond Limits." />
  <title>RenAI — Beyond Intelligence. Beyond Limits.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="#home" aria-label="RenAI home"><span class="brand-mark"><i></i><b></b></span><span>Ren<span>AI</span></span></a>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="Close menu">×</button>
      </div>
      <button class="new-chat" data-action="new-chat"><span>＋</span> New Chat <kbd>⌘ K</kbd></button>
      <div class="nav-scroll">
        <div class="nav-label">WORKSPACE</div>
        <nav class="nav-list" id="mainNav">
          <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
          <button class="nav-item" data-page="chat"><span class="nav-icon">◌</span>AI Chat</button>
          <button class="nav-item" data-page="explore"><span class="nav-icon">✧</span>Explore AI</button>
          <button class="nav-item" data-page="research"><span class="nav-icon">⌕</span>Deep Research</button>
          <button class="nav-item" data-page="studio"><span class="nav-icon">▧</span>AI Studio</button>
          <button class="nav-item" data-page="image"><span class="nav-icon">▨</span>Image Studio</button>
          <button class="nav-item" data-page="coding"><span class="nav-icon">‹ ›</span>Coding</button>
          <button class="nav-item" data-page="writing"><span class="nav-icon">✎</span>Writing</button>
          <button class="nav-item" data-page="voice"><span class="nav-icon">◖))</span>Voice Assistant</button>
        </nav>
        <div class="nav-label section-label">YOUR SPACE</div>
        <nav class="nav-list">
          <button class="nav-item" data-page="projects"><span class="nav-icon">▣</span>Projects</button>
          <button class="nav-item" data-page="files"><span class="nav-icon">▤</span>My Files</button>
          <button class="nav-item" data-page="history"><span class="nav-icon">◷</span>History</button>
          <button class="nav-item" data-page="saved"><span class="nav-icon">☆</span>Saved Items</button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <button class="nav-item" data-page="help"><span class="nav-icon">?</span>Help & Support</button>
        <div class="user-card" id="userCard"><div class="avatar">V</div><div class="user-meta"><strong>RenAI User</strong><small>Personal workspace</small></div><button class="more-btn" data-page="profile">•••</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar" aria-label="Open menu">☰</button>
        <div class="breadcrumbs"><span>RenAI</span><span class="crumb-slash">/</span><strong id="crumbCurrent">Home</strong></div>
        <div class="top-actions"><span class="status-pill"><i></i> Workspace</span><button class="icon-btn" id="themeToggle" title="Toggle theme">☼</button><button class="upgrade-btn" data-page="pricing">Upgrade <span>↗</span></button></div>
      </header>
      <div class="page-host" id="pageHost" aria-live="polite"></div>
      <footer class="app-footer"><span>RenAI can make mistakes. Verify important information.</span><span>BEYOND INTELLIGENCE. <b>BEYOND LIMITS.</b></span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion"></div>
  <input type="file" id="filePicker" hidden multiple />
  <script src="app.js"></script>
</body>
</html>
